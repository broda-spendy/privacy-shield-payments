name: Auto PR on Issue Closed

# -----------------------------------------------------------------------
# Trigger: fires whenever a GitHub Issue is closed in this repository.
# Goal   : open a Pull Request that documents / tracks the resolution,
#          following the branch-naming & PR conventions in CONTRIBUTING.md.
# -----------------------------------------------------------------------
on:
  issues:
    types: [closed]

# Needed to create branches and open pull requests via the GitHub API.
permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  open-pr-for-issue:
    name: Open PR for closed issue #${{ github.event.issue.number }}
    runs-on: ubuntu-latest

    # Skip bot-closed issues and issues that were closed as "not planned".
    if: |
      github.event.issue.state_reason == 'completed' &&
      github.actor != 'github-actions[bot]'

    steps:
      # -- 1. Check out main ----------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # -- 2. Derive a branch name from the issue -------------------------
      - name: Compute branch name
        id: branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          # Slugify: lowercase, replace spaces/special chars with hyphens, trim.
          SLUG=$(echo "$ISSUE_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g' \
            | sed 's/-\+/-/g' \
            | sed 's/^-//;s/-$//' \
            | cut -c1-50)
          BRANCH="fix/${ISSUE_NUMBER}-${SLUG}"
          echo "name=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Resolved branch name: ${BRANCH}"

      # -- 3. Check the branch doesn't already exist ----------------------
      - name: Guard - skip if branch already exists
        id: guard
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            echo "Branch '$BRANCH' already exists -- skipping PR creation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # -- 4. Create the branch off main ----------------------------------
      - name: Create branch
        if: steps.guard.outputs.skip == 'false'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          # Add a lightweight tracking file so the branch has a unique commit.
          mkdir -p .github/resolved
          printf "# Issue #%s - %s\n\n**Issue URL:** %s\n**Closed at:** %s\n**Closed by:** @%s\n\n> This file is auto-generated by the issue-to-pr workflow.\n> Update or delete it as part of the normal PR review.\n" \
            "${{ github.event.issue.number }}" \
            "${{ github.event.issue.title }}" \
            "${{ github.event.issue.html_url }}" \
            "${{ github.event.issue.closed_at }}" \
            "${{ github.actor }}" \
            > ".github/resolved/issue-${{ github.event.issue.number }}.md"

          git add ".github/resolved/issue-${{ github.event.issue.number }}.md"
          git commit -m "chore: resolve issue #${{ github.event.issue.number }} - ${{ github.event.issue.title }}"
          git push origin "$BRANCH"

      # -- 5. Determine label (feat / fix / docs / chore) ----------------
      - name: Compute PR label
        id: label
        if: steps.guard.outputs.skip == 'false'
        env:
          LABELS: ${{ toJson(github.event.issue.labels.*.name) }}
        run: |
          # Map the issue label to a conventional-commit prefix.
          if echo "$LABELS" | grep -qi '"bug"'; then
            echo "prefix=fix" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -qi '"feature\|enhancement"'; then
            echo "prefix=feat" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -qi '"documentation"'; then
            echo "prefix=docs" >> "$GITHUB_OUTPUT"
          else
            echo "prefix=chore" >> "$GITHUB_OUTPUT"
          fi

      # -- 6. Open the Pull Request ----------------------------------------
      - name: Create Pull Request
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
          PREFIX: ${{ steps.label.outputs.prefix }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ACTOR: ${{ github.actor }}
        run: |
          PR_TITLE="${PREFIX}: ${ISSUE_TITLE} (#${ISSUE_NUMBER})"

          PR_BODY="## Summary

          Closes #${ISSUE_NUMBER}

          **Issue:** [#${ISSUE_NUMBER} - ${ISSUE_TITLE}](${ISSUE_URL})
          **Resolved by:** @${ACTOR}

          ---

          ### Original issue description

          ${ISSUE_BODY:-_No description provided._}

          ---

          ### PR checklist

          - [ ] \`cargo build --workspace\` succeeds
          - [ ] \`cargo test --workspace --features testutils\` succeeds (zero failures)
          - [ ] \`cargo fmt --all -- --check\` and \`cargo clippy --workspace --all-targets -- -D warnings\` are clean
          - [ ] Docs updated if behavior, setup, or public interface changed
          - [ ] No secrets, keys, or local env files committed

          > _This PR was automatically created by the \`issue-to-pr\` workflow when issue #${ISSUE_NUMBER} was closed._"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --repo "${{ github.repository }}"

      # -- 7. Post a comment back on the issue ----------------------------
      - name: Comment on the issue
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "A pull request has been opened for this issue on branch \`${BRANCH}\`. Please review, update the checklist, and request a reviewer before merging into \`main\`." \
            --repo "${{ github.repository }}"
